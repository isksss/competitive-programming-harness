[tools]
rust = { version = "1.98.1", components = ["rustfmt"] }

[tasks.init]
description = "Initialize a local problem workspace"
usage = 'arg "<problem_id>" help="Problem ID"'
run = 'cargo run --quiet -- init "${usage_problem_id?}"'

[tasks.sample]
description = "Run local sample cases"
usage = 'arg "<problem_id>" help="Problem ID"'
run = 'cargo run --quiet -- test "${usage_problem_id?}"'

[tasks.fmt]
description = "Check Rust formatting"
run = "cargo fmt --all -- --check"

[tasks.unit]
description = "Run harness unit tests"
run = "cargo test --locked"

[tasks.build]
description = "Build the harness CLI"
run = "cargo build --locked"

[tasks.validate]
description = "Validate mise task definitions"
run = "mise tasks validate"

[tasks.verify]
description = "Run all local checks"
run = [
  "mise tasks validate",
  "cargo fmt --all -- --check",
  "cargo test --locked",
  "cargo build --locked",
]
